name: Auto Deploy Traffic Server

on: 
  push:
    branches:
      - main
      - master

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
    # Kill the old process BEFORE checkout.
    # This is critical on Windows to release file locks on logs like app.log.
    - name: Pre-cleanup Kill old server
      shell: powershell
      run: |
        $process = Get-CimInstance Win32_Process -Filter "Name = 'python.exe' AND CommandLine LIKE '%main.py%'"
        if ($process) { 
            Write-Host "Old process found (PID: $($process.ProcessId)). Killing to release file locks..."
            Stop-Process -Id $process.ProcessId -Force
            # Wait 2 seconds to ensure the OS fully releases file handles
            Start-Sleep -Seconds 2
            Write-Host "Old server killed." 
        } else { 
            Write-Host "No old server detected. Folder is ready for checkout." 
        }

    # Checkout the latest code.
    # Since the process is killed, Git can now safely delete/update files.
    - name: Checkout code
      uses: actions/checkout@v4

    # Validate Python syntax before running.
    - name: Test Code Syntax
      shell: powershell
      run: |
        $pythonPath = "C:\Users\zy\miniconda3\envs\autoAndroid\python.exe"
        Write-Host "Testing syntax..."
        & $pythonPath -m py_compile main.py

    # Launch the new process independently.
    # We use WMIC to detach the process from the Runner's job tree.
    - name: Start new server (Escaped Mode)
      shell: powershell
      run: |
        $pythonPath = "C:\Users\zy\miniconda3\envs\autoAndroid\python.exe"
        $workDir = $env:GITHUB_WORKSPACE
        
        # Use cmd /c to handle the redirection and directory change
        # -u ensures unbuffered output for real-time log monitoring
        $cmd = "cmd.exe /c cd /d $workDir && $pythonPath -u main.py > run_info.log 2> run_error.log"
        
        Write-Host "Launching independent process via WMIC..."
        $process = ([wmiclass]"win32_process").Create($cmd, $workDir, $null)
        
        if ($process.ReturnValue -eq 0) {
            $newPid = $process.ProcessId
            Write-Host "SUCCESS: Server started with PID: $newPid"
            
            # Brief pause to verify the process didn't crash on startup
            Start-Sleep -Seconds 3
            if (Get-Process -Id $newPid -ErrorAction SilentlyContinue) {
                Write-Host "Process $newPid is active and detached from Runner."
            } else {
                Write-Host "ERROR: Process died immediately. Check run_error.log for details."
                if (Test-Path "run_error.log") { Get-Content run_error.log }
                exit 1
            }
        } else {
            Write-Host "ERROR: WMIC failed to create process. Return code: $($process.ReturnValue)"
            exit 1
        }
